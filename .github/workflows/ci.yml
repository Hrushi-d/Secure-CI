name: CI demo
# Sample consumer pipeline — proves the paved road end to end

on:
  push:
    branches: [main]
  pull_request:

jobs:
  java:
    uses: Hrushi-d/Secure-CI/.github/workflows/secureci.yml@v1
    with:
      image-name: ghcr.io/hrushi-d/secure-ci/sample-java
      context: samples/java
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write

  node:
    uses: Hrushi-d/Secure-CI/.github/workflows/secureci.yml@v1
    with:
      image-name: ghcr.io/hrushi-d/secure-ci/sample-node
      context: samples/node
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
